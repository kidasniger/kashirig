name: Rig FBX
run-name: "rig ${{ inputs.job }}"

on:
  workflow_dispatch:
    inputs:
      job:
        description: "Identifiant du job (lettres minuscules et chiffres)"
        required: true
      name:
        description: "Nom du modele (lettres, chiffres, _ et -)"
        default: "model"
      triangles:
        description: "Nombre de triangles cible"
        default: "40000"

permissions:
  contents: read

jobs:
  rig:
    runs-on: ubuntu-latest
    env:
      JOB: ${{ inputs.job }}
      NAME: ${{ inputs.name }}
      TRIS: ${{ inputs.triangles }}
      B2_BUCKET: kashirig-jobs
      B2_ENDPOINT: https://s3.us-east-005.backblazeb2.com
      AWS_ACCESS_KEY_ID: ${{ secrets.B2_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_APP_KEY }}
      AWS_DEFAULT_REGION: us-east-005
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
    steps:
      - name: Verifier les entrees
        shell: bash
        run: |
          [[ "$JOB" =~ ^[a-z0-9]{8,32}$ ]] || { echo "Identifiant invalide"; exit 1; }
          [[ "$NAME" =~ ^[A-Za-z0-9_-]{1,40}$ ]] || { echo "Nom invalide"; exit 1; }
          [[ "$TRIS" =~ ^[0-9]{4,6}$ ]] || { echo "Triangles invalides"; exit 1; }
          [ -n "$AWS_ACCESS_KEY_ID" ] && [ -n "$AWS_SECRET_ACCESS_KEY" ] || { echo "Secrets B2 manquants"; exit 1; }

      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Recuperer le GLB
        shell: bash
        run: |
          mkdir -p work output
          aws s3 cp "s3://$B2_BUCKET/jobs/$JOB/input.glb" work/input.glb --endpoint-url "$B2_ENDPOINT"
          test -s work/input.glb

      - name: Installer Blender
        run: |
          sudo snap install blender --classic
          blender --version

      - name: Lancer le rig
        shell: bash
        run: |
          blender -b --python-exit-code 1 -P blender/rig_luw.py -- \
            work/input.glb assets/kidas.fbx "output/${NAME}_rigged.fbx" "$TRIS" 2>&1 | tee work/log.txt
          test -s "output/${NAME}_rigged.fbx"

      - name: Publier le FBX
        shell: bash
        run: |
          aws s3 cp "output/${NAME}_rigged.fbx" "s3://$B2_BUCKET/jobs/$JOB/output.fbx" --endpoint-url "$B2_ENDPOINT"

      - name: Supprimer le GLB source
        if: always()
        shell: bash
        run: aws s3 rm "s3://$B2_BUCKET/jobs/$JOB/input.glb" --endpoint-url "$B2_ENDPOINT" || true
