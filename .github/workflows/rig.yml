name: Rig FBX
run-name: "rig ${{ inputs.job }}"

on:
  workflow_dispatch:
    inputs:
      job:
        description: "Identifiant du job (lettres minuscules et chiffres)"
        required: true
      triangles:
        description: "Nombre de triangles cible"
        default: "40000"

permissions:
  contents: write

jobs:
  rig:
    runs-on: ubuntu-latest
    env:
      JOB: ${{ inputs.job }}
      TRIS: ${{ inputs.triangles }}
    steps:
      - name: Verifier les entrees
        shell: bash
        run: |
          [[ "$JOB" =~ ^[a-z0-9]{8,32}$ ]] || { echo "Identifiant invalide"; exit 1; }
          [[ "$TRIS" =~ ^[0-9]{4,6}$ ]] || { echo "Triangles invalides"; exit 1; }

      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Recuperer le GLB
        shell: bash
        run: |
          git fetch origin "job-$JOB"
          git checkout "origin/job-$JOB" -- "jobs/$JOB"
          mkdir -p work output
          cat jobs/$JOB/*.part > work/input.glb
          test -s work/input.glb

      - name: Installer Blender
        run: |
          sudo snap install blender --classic
          blender --version

      - name: Lancer le rig
        shell: bash
        run: |
          blender -b --python-exit-code 1 -P blender/rig_luw.py -- \
            work/input.glb assets/kidas.fbx output/rigged.fbx "$TRIS" 2>&1 | tee work/log.txt
          test -s output/rigged.fbx

      - name: Publier le FBX
        uses: actions/upload-artifact@v4
        with:
          name: fbx-${{ inputs.job }}
          path: output/rigged.fbx
          retention-days: 1
          if-no-files-found: error

      - name: Supprimer le GLB source
        if: always()
        shell: bash
        run: git push origin --delete "job-$JOB" || true
